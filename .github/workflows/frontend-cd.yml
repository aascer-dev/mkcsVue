name: Frontend CD

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mkcs-frontend

jobs:
  image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare isolated image context
        run: |
          set -euo pipefail
          rm -rf .frontend-image-context
          mkdir -p .frontend-image-context/dist
          cp deploy/Dockerfile.runtime .frontend-image-context/Dockerfile
          cp deploy/nginx.conf .frontend-image-context/nginx.conf

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.event.workflow_run.head_sha }}
          path: .frontend-image-context/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify static bundle
        run: test -f .frontend-image-context/dist/index.html

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .frontend-image-context
          file: .frontend-image-context/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}

  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && needs.image.result == 'success'
    needs: image
    permissions:
      packages: read
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    runs-on: [self-hosted, debian13(vmware)]
    timeout-minutes: 15
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/mkcs' }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mkcs-frontend
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate deployment files
        run: |
          set -euo pipefail
          test -f "$DEPLOY_ROOT/.env" || {
            echo "Missing $DEPLOY_ROOT/.env" >&2
            exit 1
          }
          test -f "$DEPLOY_ROOT/docker-compose.yml" || {
            echo "Missing $DEPLOY_ROOT/docker-compose.yml" >&2
            exit 1
          }

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          FRONTEND_IMAGE="$FRONTEND_IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file "$DEPLOY_ROOT/.env" \
              -f "$DEPLOY_ROOT/docker-compose.yml" config --quiet

      - name: Pull and update frontend
        run: |
          set -euo pipefail
          COMPOSE=(docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml")
          FRONTEND_IMAGE="$FRONTEND_IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file "$DEPLOY_ROOT/.env" \
              -f "$DEPLOY_ROOT/docker-compose.yml" pull frontend
          FRONTEND_IMAGE="$FRONTEND_IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file "$DEPLOY_ROOT/.env" \
              -f "$DEPLOY_ROOT/docker-compose.yml" up -d --no-deps frontend
          "${COMPOSE[@]}" up -d --no-deps --force-recreate nginx

      - name: Verify containers and endpoints
        run: |
          set -euo pipefail
          COMPOSE=(docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml")
          echo 'Compose services:'
          "${COMPOSE[@]}" config --services
          echo 'Compose status:'
          "${COMPOSE[@]}" ps -a

          echo 'Checking frontend container...'
          frontend_id="$(timeout 15s "${COMPOSE[@]}" ps -aq frontend)"
          if [ -z "$frontend_id" ]; then
            echo 'Frontend container was not found in Compose.' >&2
            exit 1
          fi
          frontend_status="$(timeout 15s docker inspect -f '{{.State.Status}}' "$frontend_id")"
          if [ "$frontend_status" != running ]; then
            echo "Frontend container status: $frontend_status" >&2
            "${COMPOSE[@]}" logs --no-color --tail=100 frontend >&2 || true
            exit 1
          fi

          echo 'Checking Nginx container...'
          nginx_id="$(timeout 15s "${COMPOSE[@]}" ps -aq nginx)"
          if [ -z "$nginx_id" ]; then
            echo 'Compose nginx container was not created.' >&2
            exit 1
          fi
          nginx_status="$(timeout 15s docker inspect -f '{{.State.Status}}' "$nginx_id")"
          if [ "$nginx_status" != running ]; then
            echo "Nginx container status: $nginx_status" >&2
            "${COMPOSE[@]}" logs --no-color --tail=100 nginx >&2 || true
            exit 1
          fi
          echo 'Resolving Nginx port...'
          nginx_port="$(timeout 15s "${COMPOSE[@]}" port nginx 80 | awk -F: 'NF { print $NF; exit }')"
          if [ -z "$nginx_port" ]; then
            echo 'Unable to determine the Compose nginx host port.' >&2
            exit 1
          fi

          base_url="http://127.0.0.1:${nginx_port}"
          request_status() {
            local url="$1"
            local status=000
            for attempt in $(seq 1 10); do
              status="$(curl --noproxy '*' --silent --show-error --connect-timeout 2 --max-time 5 \
                --output /dev/null --write-out '%{http_code}' "$url" || true)"
              echo "Probe $url: attempt $attempt returned $status" >&2
              case "$status" in
                2??|3??|4??) printf '%s' "$status"; return 0 ;;
                5??|000) sleep 2 ;;
                *) printf '%s' "$status"; return 0 ;;
              esac
            done
            printf '%s' "$status"
          }

          echo 'Checking homepage through Nginx...'
          home_status="$(request_status "$base_url/")"
          case "$home_status" in
            2??|3??) ;;
            *)
              echo "Unexpected homepage status: $home_status" >&2
              timeout 15s "${COMPOSE[@]}" logs --no-color --tail=100 nginx frontend >&2 || true
              exit 1
              ;;
          esac
          echo 'Checking API through Nginx...'
          api_status="$(request_status "$base_url/api/")"
          case "$api_status" in
            2??|3??|4??) ;;
            *)
              echo "Unexpected /api/ status: $api_status" >&2
              timeout 15s "${COMPOSE[@]}" logs --no-color --tail=100 nginx backend >&2 || true
              exit 1
              ;;
          esac
